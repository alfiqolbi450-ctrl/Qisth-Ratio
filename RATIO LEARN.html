<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RATIO LEARN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Konsep tata letak: bilah atas lekat + isi satu kolom; blok kurma (emas) dan air (biru) jadi motif rasio. */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface2:#E7EFED; --ink:#142B29; --muted:#4F6766; --line:#CCDAD7;
  --brand:#0B6E66; --brand-ink:#FFFFFF; --brand-soft:#D3EBE7;
  --gold-soft:#FBEBCB; --good:#1B7F4B; --good-soft:#D8F0E1; --bad:#B3392F; --bad-soft:#F8DEDA;
  --kurma:#C8861F; --air:#2A9FB8;
  --f-head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A19; --surface:#142524; --surface2:#1B302E; --ink:#E6F1EF; --muted:#9DB5B2; --line:#294541;
  --brand:#4FC3B6; --brand-ink:#06201D; --brand-soft:#173B37; --gold-soft:#3A2D10;
  --good:#5ED08F; --good-soft:#143524; --bad:#F08A80; --bad-soft:#3E1B18; --kurma:#E0A23A; --air:#4FB7D1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A19; --surface:#142524; --surface2:#1B302E; --ink:#E6F1EF; --muted:#9DB5B2; --line:#294541;
  --brand:#4FC3B6; --brand-ink:#06201D; --brand-soft:#173B37; --gold-soft:#3A2D10;
  --good:#5ED08F; --good-soft:#143524; --bad:#F08A80; --bad-soft:#3E1B18; --kurma:#E0A23A; --air:#4FB7D1; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);margin:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.2;margin:0 0 .5em;text-wrap:balance}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem)} h2{font-size:1.4rem} h3{font-size:1.15rem} h4{font-size:1rem}
p{margin:0 0 .8em;max-width:68ch} ul,ol{margin:0 0 .8em;padding-left:1.25em;max-width:68ch} li{margin:.2em 0}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* bilah atas */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 1.15rem var(--f-head);white-space:nowrap}
.logo{display:flex;gap:3px}.logo i{display:block;height:18px;border-radius:4px}.logo i:first-child{width:26px;background:var(--kurma)}.logo i:last-child{width:13px;background:var(--air)}
nav{min-width:0;overflow-x:auto;scrollbar-width:thin}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0 0 2px}
nav a{display:block;padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;white-space:nowrap}
nav a:hover{background:var(--surface2);color:var(--ink)}
nav a[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.subnav{background:var(--surface2);border-bottom:1px solid var(--line)}
.subnav ul{display:flex;gap:6px;list-style:none;margin:0;padding:8px 0;overflow-x:auto;max-width:none}
.subnav a{display:block;padding:5px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.85rem;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
.subnav a[aria-current="page"]{background:var(--brand-soft);border-color:var(--brand)}
.subnav a.done::after{content:" \2713";color:var(--good)}

main{padding-block:28px 56px;outline:none}
footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:.88rem}
footer p{margin:.2em 0;max-width:none}

/* komponen */
.eyebrow{font:600 .78rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 .4em}
.lead{font-size:1.08rem;color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
a.card{display:block;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--brand);transform:translateY(-2px)}
.card h3{margin-bottom:.3em}
.card p{color:var(--muted);font-size:.93rem;margin-bottom:.5em}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--brand-soft);color:var(--ink);font-size:.78rem;font-weight:600}
.chip.gold{background:var(--gold-soft)} .chip.ok{background:var(--good-soft);color:var(--good)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:0;background:var(--brand);color:var(--brand-ink);font:700 .95rem var(--f-body);cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pagehead{margin-bottom:22px}
.note{background:var(--gold-soft);border-radius:10px;padding:12px 14px;font-size:.93rem;max-width:68ch}
.note b{display:block;margin-bottom:2px}
.tw{overflow-x:auto;margin:0 0 .9em}
table{border-collapse:collapse;min-width:260px}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left}
th{background:var(--surface2);font-size:.9rem}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2;margin:0 3px;font-size:.95em}
.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.math{font-family:var(--f-head);font-size:1.1rem;background:var(--surface2);border-radius:10px;padding:10px 14px;display:inline-block;margin:.3em 0 .8em}

/* hero */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:clamp(22px,5vw,44px);display:grid;gap:24px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center;margin-bottom:26px}
.hero h1{margin-bottom:.15em;font-size:clamp(2rem,6vw,3.2rem)}
.hero .tag{font:600 1.05rem var(--f-head);opacity:.92;margin-bottom:.8em}
.hero p{color:inherit;opacity:.95}
.hero .btn{background:var(--brand-ink);color:var(--brand)}
.hero .btn.ghost{background:transparent;color:var(--brand-ink);border-color:var(--brand-ink)}
.demo{background:rgba(255,255,255,.14);border-radius:14px;padding:16px;display:grid;gap:10px}
.demo .r{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.demo .lb{font-size:.8rem;font-weight:600;min-width:52px}
.demo .big{font:700 1.5rem var(--f-head);text-align:center;margin-top:4px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.blk{display:inline-block;width:22px;height:22px;border-radius:5px}
.blk.k{background:var(--kurma)} .blk.a{background:var(--air)}
.demo .blk.k{background:#F2B544} .demo .blk.a{background:#6FD3E8}
.blk.sm{width:14px;height:14px;border-radius:3px}

/* progres */
.prog{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
.prog.bar{background:var(--surface2)} .prog.bar i{background:var(--air)}

/* langkah pertemuan */
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;min-width:0}
.step>h2{display:flex;align-items:center;gap:10px}
.sn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:700 .9rem var(--f-body);flex:none}
.islam{border-color:var(--kurma);background:linear-gradient(0deg,var(--surface),var(--surface))}
.islam .sn{background:var(--kurma);color:#1b1200}
.quote{border-left:4px solid var(--kurma);padding:4px 0 4px 14px;margin:.4em 0 1em;max-width:68ch}
.quote small{display:block;color:var(--muted)}
.alur{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.alur button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px;border-radius:8px;font:600 .8rem var(--f-body);cursor:pointer}
.alur button:hover{border-color:var(--brand)}

/* widget */
.wg{background:var(--surface2);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.ctrl{display:grid;gap:4px}
.ctrl label,.fld label{font-weight:600;font-size:.9rem}
.ctrl output{font-weight:700;color:var(--brand);margin-left:6px}
input[type=range]{width:100%;accent-color:var(--brand)}
input[type=text],input[type=number],select,textarea,.cell{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;max-width:260px}
textarea{max-width:68ch;min-height:84px;resize:vertical}
.cell{max-width:110px}
.fld{display:grid;gap:4px;margin-bottom:10px}
.stage{display:grid;gap:8px}
.stage .r{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.stage .lb{font-weight:600;font-size:.85rem;min-width:56px;color:var(--muted)}
.readout{background:var(--surface);border-radius:10px;padding:10px 14px;font-size:1.02rem;border:1px solid var(--line)}
.readout b{font-family:var(--f-head);font-size:1.15rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-weight:600;font-size:.9rem}
.chips span.on{border-color:var(--brand);background:var(--brand-soft)}
.bar{height:22px;border-radius:6px;background:var(--air);transition:width .25s;min-width:4px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.ok{color:var(--good)} .no{color:var(--bad)}
.cell.right,select.right{border-color:var(--good);background:var(--good-soft)}
.cell.wrong,select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-weight:600;margin:.6em 0 0}

/* soal */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:8px}
.q .qn{color:var(--brand)}
.opts{display:grid;gap:6px;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.q.ok-q{border-color:var(--good)} .q.no-q{border-color:var(--bad)}
.q .exp{margin:.6em 0 0;padding:10px 12px;border-radius:8px;font-size:.93rem;max-width:68ch}
.q.ok-q .exp{background:var(--good-soft)} .q.no-q .exp{background:var(--bad-soft)}
.q .res{font-weight:700;margin:.5em 0 0}
.sum{background:var(--brand-soft);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.sum b{font:700 1.6rem var(--f-head)}

/* peta materi */
.flow{list-style:none;padding:0;margin:0;display:grid;gap:0;max-width:760px}
.flow li{position:relative;padding:0 0 18px 54px;margin:0}
.flow li::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.flow li:last-child::before{display:none}
.flow .nb{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 1.05rem var(--f-head)}
.flow a{text-decoration:none;color:var(--ink);display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.flow a:hover{border-color:var(--brand)}
.flow small{color:var(--muted);display:block}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media(max-width:560px){.topin{flex-direction:column;align-items:stretch;gap:6px}.step{padding:16px}}
</style>

  <a class="brand" href="#beranda"><span class="logo" aria-hidden="true"><i></i><i></i></span>RATIO LEARN</a>

</div><div class="subnav" id="subnav" hidden><div class="wrap"><ul id="sublist"></ul></div></div></header>
<div class="wrap"><main id="app" tabindex="-1"></main></div>

<script>
(function(){
'use strict';
/* ---------- util ---------- */
var S={done:{},scores:{},notes:{}};
try{var raw=localStorage.getItem('ratiolearn-v1');if(raw){var p=JSON.parse(raw);S.done=p.done||{};S.scores=p.scores||{};S.notes=p.notes||{};}}catch(e){}
function save(){try{localStorage.setItem('ratiolearn-v1',JSON.stringify(S));}catch(e){}}
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a);}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',');}
function rp(n){return 'Rp'+Math.round(n).toLocaleString('id-ID');}
function fr(a,b){return '<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>';}
function blocks(n,c,sm){var s='';for(var i=0;i<n;i++)s+='<span class="blk '+c+(sm?' sm':'')+'"></span>';return s;}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function parseNum(v){
  v=String(v).replace(/rp|\s/gi,'');
  if(!v)return NaN;
  if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');
  v=v.replace(',','.');
  return /^-?\d+(\.\d+)?$/.test(v)?parseFloat(v):NaN;
}
function parseRatio(v){var m=String(v).match(/^\s*(\d+)\s*[:\/]\s*(\d+)\s*$/);return m?[+m[1],+m[2]]:null;}

/* ---------- komponen soal ---------- */
function mc(q,o,a,e){return {t:'mc',q:q,o:o,a:a,e:e};}
function nu(q,a,e,u){return {t:'num',q:q,a:a,e:e,u:u||''};}
function ra(q,a,e,s){return {t:'ratio',q:q,a:a,e:e,s:!!s};}

function quiz(root,qs,key){
  var done=[],score=0;
  function draw(){
    done=qs.map(function(){return null;});score=0;
    root.innerHTML='';
    qs.forEach(function(q,i){
      var d=document.createElement('div');d.className='q';
      var inner='<div class="qt"><span class="qn">'+(i+1)+'.</span> '+q.q+'</div>';
      if(q.t==='mc'){
        inner+='<div class="opts" role="radiogroup" aria-label="Soal '+(i+1)+'">'+q.o.map(function(o,j){
          return '<label class="opt"><input type="radio" name="'+key+'-'+i+'" value="'+j+'"><span>'+o+'</span></label>';}).join('')+'</div>';
      }else{
        inner+='<div class="fld"><label for="'+key+'-'+i+'">Jawabanmu'+(q.t==='ratio'?' (tulis seperti 3:5)':(q.u?' ('+q.u+')':''))+'</label><input type="text" id="'+key+'-'+i+'" autocomplete="off" inputmode="'+(q.t==='ratio'?'text':'decimal')+'"></div>';
      }
      inner+='<button class="btn" type="button">Periksa</button><div class="out" role="status"></div>';
      d.innerHTML=inner;root.appendChild(d);
      $('button',d).addEventListener('click',function(){check(i,d);});
    });
    var s=document.createElement('div');s.className='out-sum';root.appendChild(s);
  }
  function check(i,d){
    var q=qs[i],ok=false,out=$('.out',d);
    if(q.t==='mc'){
      var sel=d.querySelector('input:checked');
      if(!sel){out.innerHTML='<p class="res no">Pilih satu jawaban dulu.</p>';return;}
      ok=(+sel.value===q.a);
    }else{
      var inp=$('input',d),v=inp.value;
      if(q.t==='num'){var n=parseNum(v);if(isNaN(n)){out.innerHTML='<p class="res no">Tulis jawabanmu berupa angka.</p>';return;}ok=Math.abs(n-q.a)<1e-6;}
      else{var r=parseRatio(v);if(!r){out.innerHTML='<p class="res no">Tulis dengan format a:b, misalnya 3:5.</p>';return;}
        ok=q.s?(r[0]===q.a[0]&&r[1]===q.a[1]):(r[0]*q.a[1]===r[1]*q.a[0]&&r[1]>0);}
    }
    done[i]=ok;if(ok)score++;
    d.classList.add(ok?'ok-q':'no-q');
    d.querySelectorAll('input,button').forEach(function(x){x.disabled=true;});
    out.innerHTML='<p class="res '+(ok?'ok':'no')+'">'+(ok?'Benar, bagus!':'Belum tepat.')+'</p><p class="exp">'+q.e+'</p>';
    if(done.every(function(x){return x!==null;}))finish();
  }
  function finish(){
    var best=S.scores[key];if(!best||score>best.s){S.scores[key]={s:score,t:qs.length};save();}
    var pct=score/qs.length,msg=pct===1?'Sempurna. Pemahamanmu sudah kuat.':pct>=0.7?'Bagus. Baca lagi pembahasan soal yang salah.':'Ayo ulangi materinya, lalu coba lagi.';
    var s=$('.out-sum',root);
    s.innerHTML='<div class="sum"><div><div>Skormu</div><b>'+score+' / '+qs.length+'</b><div>'+msg+'</div></div><button class="btn" type="button">Ulangi soal</button></div>';
    $('button',s).addEventListener('click',function(){draw();root.scrollIntoView({block:'start'});});
    s.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  draw();
}

function fillTable(root,head,rows,okMsg){
  root.innerHTML='<div class="tw"><table><thead><tr><th>'+head[0]+'</th><th>'+head[1]+'</th></tr></thead><tbody>'+
    rows.map(function(r,i){return '<tr><td>'+r[0]+'</td><td><input class="cell" type="text" inputmode="decimal" data-i="'+i+'" aria-label="'+head[1]+' untuk '+r[0]+'"></td></tr>';}).join('')+
    '</tbody></table></div><button class="btn" type="button">Periksa tabel</button><p class="fb" role="status"></p>';
  $('button',root).addEventListener('click',function(){
    var good=0,blank=0;
    root.querySelectorAll('.cell').forEach(function(c){
      var n=parseNum(c.value),a=rows[+c.dataset.i][1];
      c.classList.remove('right','wrong');
      if(isNaN(n)){blank++;return;}
      if(Math.abs(n-a)<1e-9){c.classList.add('right');good++;}else c.classList.add('wrong');
    });
    $('.fb',root).textContent=blank?'Isi semua kolom dulu, lalu periksa lagi.':(good===rows.length?okMsg:good+' dari '+rows.length+' benar. Perbaiki kolom yang berwarna merah.');
  });
}

/* ---------- simulasi per pertemuan ---------- */
function w1(r){
  r.innerHTML='<div class="wg"><p style="margin:0">Geser untuk mengubah jumlah kotak yang akan dibagikan.</p>'+
  '<div class="ctrl"><label for="w1k">Kotak kurma<output id="w1ko"></output></label><input type="range" id="w1k" min="1" max="12" value="8"></div>'+
  '<div class="ctrl"><label for="w1a">Kotak air mineral<output id="w1ao"></output></label><input type="range" id="w1a" min="1" max="12" value="4"></div>'+
  '<div class="stage" id="w1s"></div><div class="readout" id="w1r" aria-live="polite"></div></div>';
  var k=$('#w1k',r),a=$('#w1a',r);
  function u(){
    var kv=+k.value,av=+a.value;
    $('#w1ko',r).textContent=kv;$('#w1ao',r).textContent=av;
    $('#w1s',r).innerHTML='<div class="r"><span class="lb">Kurma</span>'+blocks(kv,'k')+'</div><div class="r"><span class="lb">Air</span>'+blocks(av,'a')+'</div>';

  el.innerHTML='<div class="pagehead"><p class="eyebrow">Halaman 6</p><h1>Aktivitas Interaktif</h1><p class="lead">Semua simulasi ada di dalam pertemuan masing-masing. Buka yang kamu butuhkan, atau uji kecepatanmu di tantangan di bawah.</p></div>'+
  '<div class="grid">'+[['Ilustrasi rasio kotak','Hitung rasio kurma, air, dan seluruh kotak.'],['Simulasi rasio ekuivalen','Pengali dan penyederhanaan, plus mencocokkan pasangan.'],['Kalkulator harga satuan','Hitung harga per buah dan bandingkan dua penawaran.'],['Tabel perbandingan senilai','Ubah jumlah paket dan isi tabelnya.'],['Pekerja dan waktu','Lihat waktu berubah saat jumlah pekerja berubah.'],['Misi Berbagi','Lima tantangan perencanaan paket takjil.']].map(function(a,i){return '<a class="card" href="#p'+(i+1)+'"><span class="eyebrow">Pertemuan '+(i+1)+'</span><h3>'+a[0]+'</h3><p style="margin:0">'+a[1]+'</p></a>';}).join('')+'</div>'+
  '<h2 style="margin-top:30px">Tantangan Cepat: Sederhanakan Rasio</h2><p>Sederhanakan 8 rasio secara beruntun. Tulis hasilnya seperti 2:3.</p><div id="game" class="box" style="max-width:520px"></div>';
  setTimeout(function(){game($('#game',el));},0);
  return el;
}
function game(root){
  var pairs=[[1,2],[2,3],[3,4],[1,3],[2,5],[3,5],[4,5],[1,4],[3,7],[5,6],[2,7],[3,8]],N=8,n=0,score=0,streak=0,best=0,cur,k;
  function start(){n=0;score=0;streak=0;best=0;next();}
  function next(){
    if(n>=N){var bs=S.scores.game;if(!bs||score>bs.s){S.scores.game={s:score,t:N};save();}
      root.innerHTML='<div class="sum"><div><div>Hasil tantangan</div><b>'+score+' / '+N+'</b><div>Rentetan benar terpanjang: '+best+'</div></div><button class="btn" type="button" id="gr">Main lagi</button></div>';
      $('#gr',root).addEventListener('click',start);return;}
    cur=pairs[Math.floor(Math.random()*pairs.length)];k=2+Math.floor(Math.random()*8);
    root.innerHTML='<div class="row" style="justify-content:space-between"><span class="chip">Soal '+(n+1)+' dari '+N+'</span><span class="chip gold">Rentetan '+streak+'</span></div>'+
    '<p style="margin:14px 0 8px;font:700 1.6rem var(--f-head)">'+(cur[0]*k)+' : '+(cur[1]*k)+'</p><form class="fld" id="gf"><label for="gi">Bentuk paling sederhana</label><input type="text" id="gi" autocomplete="off" placeholder="contoh 2:3"><div class="row"><button class="btn" type="submit">Jawab</button></div></form><p class="fb" role="status" id="gfb"></p>';
    $('#gi',root).focus();
    $('#gf',root).addEventListener('submit',function(e){
      e.preventDefault();var r=parseRatio($('#gi',root).value),fb=$('#gfb',root);
      if(!r){fb.textContent='Tulis dengan format a:b, misalnya 2:3.';return;}
      var ok=r[0]===cur[0]&&r[1]===cur[1];
      if(ok){score++;streak++;if(streak>best)best=streak;}else streak=0;
      fb.className='fb '+(ok?'ok':'no');
      fb.textContent=ok?'Benar!':'Belum tepat. Jawabannya '+cur[0]+':'+cur[1]+' (dibagi '+k+').';
      $('#gf button',root).disabled=true;$('#gi',root).disabled=true;n++;
      setTimeout(next,ok?700:1800);
    });
  }
  start();
}

    M.map(function(m){var k=KUIS[m.n];return '<a class="card" href="#evaluasi-'+m.n+'"><span class="eyebrow">'+(m.n<6?'Kuis '+m.n:'Evaluasi gabungan')+'</span><h3>'+m.s+'</h3><p>'+k.length+' soal</p>'+scoreChip('kuis'+m.n)+'</a>';}).join('')+'</div>'+
    '<h3 style="margin-top:28px">Bentuk soal</h3><p>Pilihan ganda, benar atau salah, isian singkat, dan soal cerita. Untuk soal cerita, tuliskan juga langkah penyelesaianmu di buku catatan sebelum mengisi jawaban.</p>';
    return el;
  }
  var m=M[n-1];
  el.innerHTML='<div class="pagehead"><p class="eyebrow">'+(n<6?'Kuis '+n:'Evaluasi gabungan')+' · '+KUIS[n].length+' soal</p><h1>'+m.s+'</h1><p><a href="#evaluasi">← Semua kuis</a></p></div><div id="kq"></div><div class="row" style="margin-top:14px">'+(n<6?'<a class="btn" href="#evaluasi-'+(n+1)+'">Kuis berikutnya →</a>':'<a class="btn" href="#islam">Ke Integrasi Islam →</a>')+'</div>';
  setTimeout(function(){quiz($('#kq',el),KUIS[n],'kuis'+n);},0);
  return el;
}
function vIslam(){
  var el=document.createElement('div');
  el.innerHTML='<div class="pagehead"><p class="eyebrow">Halaman 8</p><h1>Integrasi Islam</h1><p class="lead">Nilai Islam hadir di setiap pertemuan dan terhubung langsung dengan cara kita menghitung dan berbagi.</p></div>'+
  '<div class="note" style="margin-bottom:18px"><b>Catatan penggunaan</b>Ayat dan hadis ditulis dalam terjemah makna. Untuk kutipan lengkap, rujuklah Al-Qur\'an dan terjemahnya (Kementerian Agama) serta kitab hadis aslinya, dan konsultasikan dengan guru Pendidikan Agama Islam.</div>'+
  '<div class="grid">'+M.map(function(m){return '<div class="card"><span class="eyebrow">Pertemuan '+m.n+' · '+m.s+'</span><h3>'+m.nilai+'</h3><div class="quote" style="margin-bottom:.5em">'+m.ref.dalil+'<small>'+m.ref.src+'</small></div><p style="color:var(--ink)">'+m.ref.kait+'</p></div>';}).join('')+'</div>'+
  '<h2 style="margin-top:30px">Matematika sebagai jalan berbuat adil dan amanah</h2><p>Rasio membantu kita menakar dengan tepat, membagi dengan adil, menghitung harga dengan jujur, dan menggunakan bahan tanpa berlebih-lebihan. Ketepatan menghitung bukan tujuan akhir, tetapi cara menjaga hak orang lain dan menunaikan amanah.</p>'+
  '<h2 style="margin-top:30px">Jurnal refleksimu</h2><p>Refleksi yang kamu tulis di tiap pertemuan terkumpul di sini.</p><div id="jr"></div>';
  var jr=$('#jr',el),any=false,h='';
  M.forEach(function(m){if(S.notes[m.n]&&S.notes[m.n].trim()){any=true;h+='<div class="card" style="margin-bottom:10px"><span class="eyebrow">Pertemuan '+m.n+' · '+m.nilai+'</span><p style="color:var(--ink);margin:0;white-space:pre-wrap">'+esc(S.notes[m.n])+'</p></div>';}});
  jr.innerHTML=any?h:'<p class="chip">Belum ada refleksi. Tulis di bagian terakhir tiap pertemuan.</p>';
  return el;
}

/* ---------- router ---------- */
var app=$('#app'),navEl=$('#nav'),sub=$('#subnav'),subl=$('#sublist');
function route(){
  var id=(location.hash||'#beranda').slice(1),cur='beranda',content;
  var mm=id.match(/^p([1-6])$/),em=id.match(/^evaluasi-([1-6])$/);
  if(mm){cur='pembelajaran';content=vMeeting(+mm[1]);}
  else if(em){cur='evaluasi';content=vEvaluasi(+em[1]);}
  else{
    var map={beranda:vBeranda,petunjuk:vPetunjuk,tujuan:vTujuan,peta:vPeta,pembelajaran:vPembelajaran,aktivitas:vAktivitas,evaluasi:function(){return vEvaluasi(0);},islam:vIslam,referensi:vReferensi};
    if(!map[id])id='beranda';cur=id;content=map[id]();
  }
  app.innerHTML='';
  if(typeof content==='string'){app.innerHTML=content;}else app.appendChild(content);
  navEl.innerHTML=NAV.map(function(x){return '<li><a href="#'+x[0]+'"'+(x[0]===cur?' aria-current="page"':'')+'>'+x[1]+'</a></li>';}).join('');
  if(cur==='pembelajaran'){
    sub.hidden=false;
    subl.innerHTML=M.map(function(m){return '<li><a href="#p'+m.n+'" class="'+(S.done[m.n]?'done':'')+'"'+(mm&&+mm[1]===m.n?' aria-current="page"':'')+'>P'+m.n+' '+m.s+'</a></li>';}).join('');
  }else sub.hidden=true;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
